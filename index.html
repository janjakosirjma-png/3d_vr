<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Test 3D scene</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#help{position:fixed;z-index:9999;left:10px;top:10px;background:#000a;color:#fff;padding:10px 12px;border-radius:10px;font:14px system-ui}
</style>
</head>
<body>
<div id="help">3D test: modro nebo + tla + pot + jezero + hiša. Joystick: ↑↓ naprej/nazaj, ←→ levo/desno.</div>

<a-scene
  vr-mode-ui="enabled:true"
  device-orientation-permission-ui="enabled:true"
  renderer="antialias:true; colorManagement:true"
  background="color:#87CEEB">

  <a-sky color="#87CEEB"></a-sky>

  <a-entity light="type:ambient;color:#ffffff;intensity:1"></a-entity>
  <a-entity light="type:directional;color:#ffffff;intensity:1.2" position="-5 10 5"></a-entity>

  <!-- tla -->
  <a-plane rotation="-90 0 0" width="100" height="100" color="#6fa35b"></a-plane>

  <!-- pot -->
  <a-plane position="0 0.02 -15" rotation="-90 0 0" width="3.5" height="35" color="#c8ae7c"></a-plane>

  <!-- jezero -->
  <a-circle position="13 0.03 -22" rotation="-90 0 0" radius="8"
            material="color:#4fa9d3;opacity:.9;transparent:true"></a-circle>

  <!-- hiša -->
  <a-box position="-7 1.5 -19" width="6" height="3" depth="5" color="#e3b477"></a-box>
  <a-cone position="-7 4 -19" radius-bottom="4.2" radius-top="0" height="2.8"
          segments-radial="4" rotation="0 45 0" color="#9d463c"></a-cone>
  <a-box position="-7 1.1 -16.47" width="1.3" height="2.2" depth=".12" color="#5b3b28"></a-box>

  <!-- drevesa -->
  <a-entity position="7 0 -10">
    <a-cylinder position="0 1.5 0" radius=".4" height="3" color="#75502e"></a-cylinder>
    <a-sphere position="0 4 0" radius="1.8" color="#347746"></a-sphere>
  </a-entity>
  <a-entity position="-11 0 -9">
    <a-cylinder position="0 1.5 0" radius=".4" height="3" color="#75502e"></a-cylinder>
    <a-sphere position="0 4 0" radius="1.8" color="#347746"></a-sphere>
  </a-entity>

  <!-- hribi -->
  <a-cone position="-25 7 -45" radius-bottom="15" radius-top="1" height="17" color="#577a58"></a-cone>
  <a-cone position="5 9 -52" radius-bottom="18" radius-top="2" height="21" color="#496c52"></a-cone>
  <a-cone position="27 6 -44" radius-bottom="14" radius-top="1" height="15" color="#63875d"></a-cone>

  <a-entity id="rig" position="0 0 4">
    <a-camera id="camera" position="0 1.6 0"
      wasd-controls="enabled:false"
      look-controls="enabled:true;magicWindowTrackingEnabled:true;touchEnabled:true;mouseEnabled:true">
    </a-camera>
  </a-entity>

</a-scene>

<script>
const rig=document.getElementById("rig");
const scene=document.querySelector("a-scene");

function move(forward,side=0){
  if(!scene.camera)return;
  const f=new THREE.Vector3();
  scene.camera.getWorldDirection(f);
  f.y=0;
  if(f.lengthSq()<0.001)return;
  f.normalize();
  const r=new THREE.Vector3(-f.z,0,f.x);
  rig.object3D.position.addScaledVector(f,forward);
  rig.object3D.position.addScaledVector(r,side);
}

addEventListener("keydown",e=>{
  if(e.repeat)return;
  switch(e.key){
    case "MediaFastForward": move(.6,0); break;
    case "MediaRewind": move(-.6,0); break;
    case "MediaTrackPrevious": move(0,-.6); break;
    case "MediaTrackNext": move(0,.6); break;
    default:return;
  }
  e.preventDefault();
},{capture:true});
</script>
</body>
</html>
